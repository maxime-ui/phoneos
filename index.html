<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astéria — Gacha RPG</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="top-bar" id="top-bar">
    <div class="top-brand">⚔ Astéria</div>
    <nav class="top-tabs" id="top-tabs"></nav>
    <button class="top-tab" id="btn-fullscreen" title="Plein écran">⛶ Plein écran</button>
    <span class="top-clock" id="top-clock">--:--</span>
  </header>

  <!-- Conteneur d'app -->
  <main class="app-body" id="app-body"></main>

  <!-- Notifications -->
  <div class="notif-stack" id="notif-stack"></div>

  <template id="tpl-notification">
    <div class="notif">
      <div class="notif-icon"></div>
      <div class="notif-content">
        <div class="notif-title"></div>
        <div class="notif-text"></div>
      </div>
    </div>
  </template>

  <script src="js/os.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/svgart.js"></script>
  <script src="js/apps/asteria.js"></script>
  <script src="js/apps/heroes.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/trophies.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
